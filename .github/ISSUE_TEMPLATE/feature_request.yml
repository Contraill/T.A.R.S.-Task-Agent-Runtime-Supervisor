name: Feature request
description: Propose a concrete capability or workflow improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What recurring problem should T.A.R.S. solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior or interface.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints / trade-offs
      description: Note security, privacy, runtime, maintenance or compatibility concerns.
