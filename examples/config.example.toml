# Development example. The final setup wizard will generate this.
version = 1

[paths]
data = "~/.local/share/tars"
state = "~/.local/state/tars"
cache = "~/.cache/tars"
workspace = "~/TARS-Workspace"

[ui]
# Optional. Defaults to the local operating-system username.
# display_name = "Local User"

[runtime]
backend = "llama.cpp"
manager = "llama-swap"
base_url = "http://127.0.0.1:8080"
llama_swap_config = "~/.config/tars/llama-swap/config.yaml"

[core]
host = "127.0.0.1"
port = 8765
allow_remote = false

# Optional Heavy runtime. Leaving this section commented keeps Oracle unconfigured.
# [colibri]
# base_url = "http://127.0.0.1:9988"
# ttl_seconds = 60

[extensions]
enabled = []
trusted = []

[secrets]
# Optional per-reference consumer restrictions. Values remain outside configuration.
# [secrets.scopes]
# "env:TAVILY_API_KEY" = ["web:tavily"]

[policy.zero_idle]
enabled = true
default_ttl_seconds = 30
allow_dgpu_sleep = true

[policy.reasoning]
default_visibility = "hidden"
persist_raw = false
separate_tool_trace = true

[scheduler]
max_concurrency = 1

[scheduler.conditions.workspace_ready]
type = "path-exists"
path = "~/TARS-Workspace/.ready"

# [scheduler.conditions.prerequisite_done]
# type = "task-state"
# task_id = "task-..."
# state = "completed"
